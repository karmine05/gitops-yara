# OCF reports for detect.sql. Import: fleetctl apply -f fleet/ocf/detect.yml
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Per-publisher row counts since last run of this query."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-0-1-publisher-row-counts"
  observer_can_run: false
  platform: ""
  query: "SELECT name, publisher, events, active FROM osquery_events ORDER BY events DESC;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Distinct binaries executed, with activity count and the user(s) who ran them."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-mac-1-executables"
  observer_can_run: false
  platform: "darwin"
  query: "SELECT path, count(*) AS n, datetime(min(time),'unixepoch') AS first_seen, datetime(max(time),'unixepoch') AS last_seen, group_concat(DISTINCT username) AS users FROM es_process_events WHERE time > 0 AND event_type = 'EXEC' GROUP BY path ORDER BY n DESC LIMIT 50;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Unsigned or ad-hoc binaries executed. codesigning_flags is a comma list: NOT_VALID, ADHOC, NOT_RUNTIME, INSTALLER."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-mac-2-unsigned-adhoc-exec"
  observer_can_run: false
  platform: "darwin"
  query: "SELECT datetime(time,'unixepoch') AS t, pid, path, username, substr(cmdline, 1, 200) AS cmdline, codesigning_flags FROM es_process_events WHERE time > 0 AND event_type = 'EXEC' AND (codesigning_flags LIKE '%ADHOC%' OR codesigning_flags LIKE '%NOT_VALID%') ORDER BY time DESC LIMIT 25;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Shell-spawned interpreters and download tools; parent and child joined from es_process_events on pid."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-mac-3-shell-spawned-downloads"
  observer_can_run: false
  platform: "darwin"
  query: "SELECT datetime(e.time,'unixepoch') AS t, e.pid AS child_pid, e.path AS child_path, substr(e.cmdline, 1, 200) AS child_cmdline, p.path AS parent_path FROM es_process_events e JOIN es_process_events p ON e.parent = p.pid AND p.time > 0 WHERE e.time > 0 AND e.event_type = 'EXEC' AND (e.path LIKE '%/curl'   OR e.path LIKE '%/wget' OR e.path LIKE '%/python3' OR e.path LIKE '%/perl' OR e.path LIKE '%/base64') AND (p.path LIKE '%/zsh' OR p.path LIKE '%/bash' OR p.path LIKE '%/sh' OR p.path LIKE '%/ssh' OR p.path LIKE '%/fish' OR p.path LIKE '%/tmux') ORDER BY e.time DESC LIMIT 25;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "FIM changes with the writing process; es_process_file_events pairs each monitored-path change with the pid."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-mac-4-fim-with-writer"
  observer_can_run: false
  platform: "darwin"
  query: "SELECT datetime(time,'unixepoch') AS t, pid, path AS writer, event_type, dest_filename FROM es_process_file_events WHERE time > 0 ORDER BY time DESC LIMIT 50;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Hashed file changes, ready for a YARA scan. sha256 is only populated when hashed = 1; the size cap keeps the sweep under a sensible yara_delay budget."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-mac-5-hashed-changes-for-yara"
  observer_can_run: false
  platform: "darwin"
  query: "SELECT datetime(time,'unixepoch') AS t, target_path, action, size, sha256 FROM file_events WHERE time > 0 AND action IN ('CREATE','UPDATE') AND size > 0 AND size < 104857600 AND hashed = 1 ORDER BY time DESC LIMIT 50;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Downloads that FIM also saw; chrome_download_history (ATC) joined to the file_events FIM stream."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-mac-6-downloads-vs-fim"
  observer_can_run: false
  platform: "darwin"
  query: "SELECT d.id, d.target_path, f.action, f.size, f.sha256 FROM chrome_download_history d LEFT JOIN file_events f ON f.target_path = d.target_path AND f.time > 0 ORDER BY d.id DESC LIMIT 25;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Browser history pointing at executables and scripts. Chrome timestamps are microseconds since 1601-01-01."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-mac-7-browser-history-executables"
  observer_can_run: false
  platform: "darwin"
  query: "SELECT url, title, visit_count, datetime(last_visit_time/1000000 - 11644473600,'unixepoch') AS last_visit FROM chrome_url_history WHERE url LIKE '%.exe%' OR url LIKE '%.scr%' OR url LIKE '%.vbs%' OR url LIKE '%.js%'  OR url LIKE '%.bat%' OR url LIKE '%.php?%' ORDER BY last_visit_time DESC LIMIT 25;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Quarantine origin triangulation: Gatekeeper tag, download record, and FIM sighting in one row. Apple epoch is 2001-01-01, hence the +978307200 offset."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-mac-8-quarantine-triangulation"
  observer_can_run: false
  platform: "darwin"
  query: "SELECT datetime(q.timestamp + 978307200,'unixepoch') AS quarantined, q.data_url, q.agent_name, q.origin_url, f.action, f.size, f.sha256 FROM quarantine_items q LEFT JOIN file_events f ON f.target_path = q.data_url AND f.time > 0 ORDER BY q.timestamp DESC LIMIT 25;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "BPF process activity, recent executions. probe_error = 0 filters probe failures."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-linux-1-bpf-recent-execs"
  observer_can_run: false
  platform: "linux"
  query: "SELECT datetime(time,'unixepoch') AS t, pid, parent, path, substr(cmdline, 1, 200) AS cmdline, cwd FROM bpf_process_events WHERE time > 0 AND probe_error = 0 ORDER BY time DESC LIMIT 50;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "BPF process activity, distinct binaries and counts."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-linux-2-bpf-distinct-binaries"
  observer_can_run: false
  platform: "linux"
  query: "SELECT path, count(*) AS n, datetime(min(time),'unixepoch') AS first_seen, datetime(max(time),'unixepoch') AS last_seen FROM bpf_process_events WHERE time > 0 AND probe_error = 0 GROUP BY path ORDER BY n DESC LIMIT 50;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "BPF socket activity, outbound connects. If empty, drop the syscall filter and look at the syscall values that come back."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-linux-3-bpf-outbound-connects"
  observer_can_run: false
  platform: "linux"
  query: "SELECT datetime(time,'unixepoch') AS t, path, pid, remote_address, remote_port, syscall FROM bpf_socket_events WHERE time > 0 AND probe_error = 0 AND syscall = 'connect' ORDER BY time DESC LIMIT 50;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "BPF socket activity, what is talking to what."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-linux-4-bpf-talks-to"
  observer_can_run: false
  platform: "linux"
  query: "SELECT path, remote_address, remote_port, count(*) AS n FROM bpf_socket_events WHERE time > 0 AND probe_error = 0 AND syscall = 'connect' GROUP BY path, remote_address, remote_port ORDER BY n DESC LIMIT 50;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Process starts by binary, elevation level, and user."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-win-1-etw-starts-by-binary"
  observer_can_run: false
  platform: "windows"
  query: "SELECT path, substr(cmdline, 1, 150) AS cmdline, username, token_elevation_type, count(*) AS n, max(datetime) AS last_seen FROM process_etw_events WHERE time > 0 AND type = 'ProcessStart' GROUP BY path, cmdline, username, token_elevation_type ORDER BY last_seen DESC LIMIT 50;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Elevated process starts only (TokenElevationTypeFull)."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-win-2-elevated-starts"
  observer_can_run: false
  platform: "windows"
  query: "SELECT datetime(time,'unixepoch') AS t, pid, path, username, substr(cmdline, 1, 200) AS cmdline FROM process_etw_events WHERE time > 0 AND type = 'ProcessStart' AND token_elevation_type = 'TokenElevationTypeFull' ORDER BY time DESC LIMIT 25;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "DNS lookups with the calling process."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-win-3-dns-with-caller"
  observer_can_run: false
  platform: "windows"
  query: "SELECT datetime(d.time,'unixepoch') AS t, d.name, d.path, p.username, d.response FROM dns_lookup_events d LEFT JOIN process_etw_events p ON p.pid = d.pid AND p.time > 0 AND p.type = 'ProcessStart' WHERE d.time > 0 ORDER BY d.time DESC LIMIT 50;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "PowerShell script blocks, most unusual first; low cosine_similarity means unusual."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-win-4-powershell-unusual"
  observer_can_run: false
  platform: "windows"
  query: "SELECT datetime(time,'unixepoch') AS t, script_name, script_path, cosine_similarity, substr(script_text, 1, 300) AS head FROM powershell_events WHERE time > 0 AND cosine_similarity < 0.3 ORDER BY cosine_similarity LIMIT 25;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Security log, logons and process creation: 4624 logon success, 4688 process created, 4720 account locked."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-win-5-security-logons"
  observer_can_run: false
  platform: "windows"
  query: "SELECT datetime(time,'unixepoch') AS t, eventid, substr(data, 1, 400) AS data_head FROM windows_events WHERE time > 0 AND source = 'Security' AND eventid IN (4624, 4688, 4720) ORDER BY time DESC LIMIT 25;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "NTFS renames and deletes under the monitored directories."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-win-6-ntfs-rename-delete"
  observer_can_run: false
  platform: "windows"
  query: "SELECT datetime(time,'unixepoch') AS t, action, path, old_path FROM ntfs_journal_events WHERE time > 0 AND action IN ('FILE_RENAME_OLD','FILE_RENAME_NEW','FILE_DELETE') ORDER BY time DESC LIMIT 25;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "NTFS activity by action (sanity: what the journal is doing at all)."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-win-7-ntfs-by-action"
  observer_can_run: false
  platform: "windows"
  query: "SELECT action, count(*) AS n, datetime(max(time),'unixepoch') AS last_seen FROM ntfs_journal_events WHERE time > 0 GROUP BY action ORDER BY n DESC;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Browser history pointing at executables and scripts. Chrome timestamps are microseconds since 1601-01-01."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-win-8-browser-history-executables"
  observer_can_run: false
  platform: "windows"
  query: "SELECT url, title, visit_count, datetime(last_visit_time/1000000 - 11644473600,'unixepoch') AS last_visit FROM chrome_url_history WHERE url LIKE '%.exe%' OR url LIKE '%.scr%' OR url LIKE '%.vbs%' OR url LIKE '%.js%'  OR url LIKE '%.bat%' OR url LIKE '%.php?%' ORDER BY last_visit_time DESC LIMIT 25;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Most recent downloads, both browsers."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "detect-win-9-recent-downloads"
  observer_can_run: false
  platform: "windows"
  query: "SELECT id, current_path, target_path FROM chrome_download_history ORDER BY id DESC LIMIT 25;"
