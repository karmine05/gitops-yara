# Fleet agent options - v4
# Updated 2026-08-31. Supersedes v3.
#
# YARA IS ON-DEMAND ONLY IN THIS VERSION.
#   The yara_events tier is gone: no `yara.signatures`, no `yara.file_paths`,
#   no rule files deployed to hosts. YARA now runs only when an analyst queries
#   the yara_file or yara_process table with a sigurl.
#
#   Trade-off, stated plainly: nothing scans automatically any more. A malicious
#   file landing in Downloads produces a file_events row but no YARA verdict
#   until someone runs a query. FIM still records every change - see file_paths.
#
# How the allowlist works (osquery isRuleUrlAllowed, tables/yara/yara.cpp):
#   scheme and host must match EXACTLY (case-sensitive string compare), and the
#   URL PATH is compiled as a std::regex and full-matched. So one entry covers a
#   whole directory tree. Verified: it correctly rejects other repos, plain
#   http, and paths with anything appended after .yar.
#
# Kept from v3:
#   - Win_Yara_File_Path renamed to windows_file_events (drives ntfs_journal_events)
#   - Windows paths single-quoted so YAML keeps the backslashes literal
#   - Linux eventing on BPF; audit family off by decision

config:
  options:
    pack_delimiter: /
    logger_tls_period: 60
    distributed_plugin: tls
    disable_distributed: false
    logger_tls_endpoint: /api/osquery/log
    distributed_interval: 60
    distributed_tls_max_attempts: 3
  decorators:
    load:
      - SELECT uuid AS host_uuid FROM system_info;
      - SELECT hostname AS hostname FROM system_info;

overrides:
  platforms:

    darwin:
      yara:
        # On-demand allowlist only. No `signatures` and no `file_paths` here,
        # so yara_events does not run.
        #
        # First entry: every .yar anywhere under this repo's rules/ tree.
        # Add a file to the repo and it is usable immediately - no config change.
        signature_urls:
          - 'https://raw.githubusercontent.com/karmine05/gitops-yara/main/rules/.*\.yar'
          - 'https://raw.githubusercontent.com/Neo23x0/signature-base/master/yara/.*\.yar'
      options:
        pack_delimiter: /
        logger_tls_period: 60
        distributed_plugin: tls
        disable_distributed: false
        logger_tls_endpoint: /api/osquery/log
        distributed_interval: 60
        distributed_tls_max_attempts: 3
      decorators:
        load:
          - SELECT uuid AS host_uuid FROM system_info;
          - SELECT hostname AS hostname FROM system_info;
      file_paths:
        # Drives file_events (FIM). Unrelated to YARA now that yara_events is
        # off, but still the record of what changed and where to point a scan.
        Mac_Yara_File_Path:
          - /Users/%%/Desktop/%%
          - /Users/%%/Downloads/%%
          - /Users/%%/Documents/%%
      auto_table_construction:
        quarantine_items:
          path: >-
            /Users/%%/Library/Preferences/com.apple.LaunchServices.QuarantineEventsV2
          query: >-
            SELECT LSQuarantineEventIdentifier as id, LSQuarantineAgentName as
            agent_name, LSQuarantineAgentBundleIdentifier as
            agent_bundle_identifier, LSQuarantineTypeNumber as type,
            LSQuarantineDataURLString as data_url,LSQuarantineOriginURLString as
            origin_url, LSQuarantineSenderName as sender_name,
            LSQuarantineSenderAddress as sender_address, LSQuarantineTimeStamp
            as timestamp from LSQuarantineEvent
          columns:
            - id
            - type
            - agent_name
            - agent_bundle_identifier
            - timestamp
            - sender_name
            - sender_address
            - origin_url
            - data_url
        chrome_url_history:
          path: /Users/%%/Library/Application Support/Google/Chrome/%%/History
          query: >-
            SELECT urls.id id, urls.url url, urls.title title, urls.visit_count
            visit_count, urls.typed_count typed_count, urls.last_visit_time
            last_visit_time, urls.hidden hidden, visits.visit_time visit_time,
            visits.from_visit from_visit, visits.visit_duration visit_duration,
            visits.transition transition, visit_source.source source FROM urls
            JOIN visits ON urls.id = visits.url LEFT JOIN visit_source ON
            visits.id = visit_source.id
          columns:
            - id
            - url
            - title
            - visit_count
            - last_visit_time
            - hidden
            - visit_time
            - from_visit
            - visit_duration
            - transition
            - source
        firefox_url_history:
          path: >-
            /Users/%%/Library/Application
            Support/Firefox/Profiles/%%/places.sqlite
          query: |-
            SELECT guid, url, title, visit_count, last_visit_date, hidden
            FROM moz_places
          columns:
            - guid
            - url
            - title
            - visit_count
            - last_visit_date
            - hidden
        chrome_download_history:
          path: /Users/%%/Library/Application Support/Google/Chrome/%%/History
          query: >-
            SELECT downloads.id id, downloads.current_path,
            downloads.target_path FROM downloads
          columns:
            - id
            - current_path
            - target_path

    ubuntu:
      yara:
        signature_urls:
          - 'https://raw.githubusercontent.com/karmine05/gitops-yara/main/rules/.*\.yar'
          - 'https://raw.githubusercontent.com/Neo23x0/signature-base/master/yara/.*\.yar'
      options:
        pack_delimiter: /
        logger_tls_period: 60
        distributed_plugin: tls
        disable_distributed: false
        logger_tls_endpoint: /api/osquery/log
        distributed_interval: 60
        distributed_tls_max_attempts: 3
      decorators:
        load:
          - SELECT uuid AS host_uuid FROM system_info;
          - SELECT hostname AS hostname FROM system_info;
      file_paths:
        ubuntu_file_events:
          - /home/ubuntu/%%
          - /etc/%%
          - /tmp/%%
          - /var/tmp/%%

    windows:
      yara:
        signature_urls:
          - 'https://raw.githubusercontent.com/karmine05/gitops-yara/main/rules/.*\.yar'
          - 'https://raw.githubusercontent.com/Neo23x0/signature-base/master/yara/.*\.yar'
      options:
        pack_delimiter: /
        logger_tls_period: 60
        distributed_plugin: tls
        disable_distributed: false
        logger_tls_endpoint: /api/osquery/log
        distributed_interval: 60
        distributed_tls_max_attempts: 3
      decorators:
        load:
          - SELECT uuid AS host_uuid FROM system_info;
          - SELECT hostname AS hostname FROM system_info;
      file_paths:
        # RENAMED from Win_Yara_File_Path. Drives ntfs_journal_events, not YARA.
        # Breaking change: the `category` column value changes - update any saved
        # query filtering on 'Win_Yara_File_Path' when you apply this.
        windows_file_events:
          - 'C:\Users\%%\Desktop\%%'
          - 'C:\Users\%%\Downloads\%%'
          - 'C:\Users\%%\Documents\%%'
      auto_table_construction:
        edge_url_history:
          path: 'C:\Users\%%\AppData\Local\Microsoft\Edge\User Data\%%\History'
          query: >-
            SELECT urls.url url, urls.title title, urls.last_visit_time
            last_visit_time, urls.visit_count FROM urls
          columns:
            - url
            - title
            - last_visit_time
            - visit_count
        chrome_url_history:
          path: 'C:\Users\%%\AppData\Local\Google\Chrome\User Data\%%\History'
          query: >-
            SELECT urls.id id, urls.url url, urls.title title, urls.visit_count
            visit_count, urls.typed_count typed_count, urls.last_visit_time
            last_visit_time, urls.hidden hidden, visits.visit_time visit_time,
            visits.from_visit from_visit, visits.visit_duration visit_duration,
            visits.transition transition, visit_source.source source FROM urls
            JOIN visits ON urls.id = visits.url LEFT JOIN visit_source ON
            visits.id = visit_source.id
          columns:
            - id
            - url
            - title
            - visit_count
            - last_visit_time
            - hidden
            - visit_time
            - from_visit
            - visit_duration
            - transition
            - source
        firefox_url_history:
          path: 'C:\Users\%%\AppData\Roaming\Mozilla\Firefox\Profiles\%%\places.sqlite'
          query: |-
            SELECT guid, url, title, visit_count, last_visit_date, hidden
            FROM moz_places
          columns:
            - guid
            - url
            - title
            - visit_count
            - last_visit_date
            - hidden
        chrome_download_history:
          path: 'C:\Users\%%\AppData\Local\Google\Chrome\User Data\%%\History'
          query: >-
            SELECT downloads.id id, downloads.current_path,
            downloads.target_path FROM downloads
          columns:
            - id
            - current_path
            - target_path

command_line_flags:
  verbose: false
  events_max: 50000
  events_expiry: 3600
  logger_plugin: tls
  disable_events: false
  disable_watchdog: true

  # --- Linux ---
  enable_bpf_events: true          # bpf_process_events, bpf_socket_events

  # --- macOS + Linux ---
  # Still needed: this drives file_events (FIM). It no longer triggers YARA,
  # because yara_events is off in this version.
  enable_file_events: true

  # --- macOS ---
  disable_endpointsecurity: false      # es_process_events (needs Full Disk Access per host)
  disable_endpointsecurity_fim: false  # es_process_file_events

  # --- Windows ---
  enable_ntfs_event_publisher: true          # ntfs_journal_events
  enable_windows_events_publisher: true      # windows_events
  enable_windows_events_subscriber: true
  enable_powershell_events_subscriber: true  # powershell_events (needs Script Block Logging via GPO)
  enable_process_etw_events: true            # process_etw_events
  enable_dns_lookup_events: true             # dns_lookup_events
  windows_event_channels: Security,Application,System

  # --- YARA ---
  # MUST stay false. This does NOT control TLS. True makes osquery send a POST
  # with the node key instead of a GET, for a server that authenticates rule
  # requests. raw.githubusercontent.com would reject that and every fetch fails.
  # osquery always validates the HTTPS certificate regardless.
  yara_sigurl_authenticate: false

  # Sleep between file scans, in ms. Matters more now that scanning is on demand:
  # a directory sweep pays this per file, so 1000 files costs ~50s of pure delay.
  # Lower it for faster sweeps at the cost of bigger memory spikes.
  yara_delay: 50
