# Fleet report specs for health-check.sql. Import: fleetctl apply -f fleet/ocsf/health-check.yml
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Post-deployment agent version, flags, table and publisher checks. Run everywhere first."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "health-1-agent-flags-all"
  observer_can_run: false
  platform: ""
  query: "SELECT 'agent_version' AS check_name, (SELECT version FROM osquery_info) AS value, 'note it' AS expected UNION ALL SELECT 'config_valid', (SELECT CAST(config_valid AS TEXT) FROM osquery_info), '1' UNION ALL SELECT 'flag:disable_events',(SELECT value FROM osquery_flags WHERE name='disable_events'), 'false' UNION ALL SELECT 'flag:events_expiry', (SELECT value FROM osquery_flags WHERE name='events_expiry'), '3600' UNION ALL SELECT 'flag:enable_file_events', (SELECT value FROM osquery_flags WHERE name='enable_file_events'), 'true' UNION ALL SELECT 'flag:yara_sigurl_authenticate', (SELECT value FROM osquery_flags WHERE name='yara_sigurl_authenticate'), 'false' UNION ALL SELECT 'flag:yara_delay', (SELECT value FROM osquery_flags WHERE name='yara_delay'), '50' UNION ALL SELECT 'flag:disable_audit', (SELECT value FROM osquery_flags WHERE name='disable_audit'), 'true (by design)' UNION ALL SELECT 'flag:enable_bpf_events EXISTS', (SELECT CAST(count(*) AS TEXT) FROM osquery_flags WHERE name='enable_bpf_events'), '1 on <=5.23.1' UNION ALL SELECT 'tbl:bpf_process_events EXISTS', (SELECT CAST(count(*) AS TEXT) FROM osquery_registry WHERE registry='table' AND name='bpf_process_events'), '1 on <=5.23.1' UNION ALL SELECT 'tbl:yara_file EXISTS', (SELECT CAST(count(*) AS TEXT) FROM osquery_registry WHERE registry='table' AND name='yara_file'), '1' UNION ALL SELECT 'publishers_active', (SELECT CAST(count(*) AS TEXT) FROM osquery_events WHERE active=1), '>0' UNION ALL SELECT 'publishers_with_events', (SELECT CAST(count(*) AS TEXT) FROM osquery_events WHERE events>0), '>0' UNION ALL SELECT 'osqueryd_resident_mb', (SELECT CAST(p.resident_size/1048576 AS TEXT) FROM osquery_info i JOIN processes p ON p.pid=i.pid), 'watchdog is off - watch this';"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "macOS evented table row counts. First: touch a file in Downloads. es_* = 0 usually means Full Disk Access is missing."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "health-2-macos-evented"
  observer_can_run: false
  platform: "darwin"
  query: "SELECT 'es_process_events' AS tbl, CAST(count(*) AS TEXT) AS n, '>0 (else no Full Disk Access)' AS expected FROM es_process_events WHERE time > 0 UNION ALL SELECT 'es_process_file_events', CAST(count(*) AS TEXT), '>0 (else no Full Disk Access)' FROM es_process_file_events WHERE time > 0 UNION ALL SELECT 'file_events (all)', CAST(count(*) AS TEXT), '>0' FROM file_events WHERE time > 0 UNION ALL SELECT 'file_events Mac_Yara_File_Path', CAST(count(*) AS TEXT), '>0 after you touch a file' FROM file_events WHERE time > 0 AND category='Mac_Yara_File_Path' UNION ALL SELECT 'yara_events', CAST(count(*) AS TEXT), '0 - correct, v5 is on-demand only' FROM yara_events WHERE time > 0;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Linux evented table row counts. First: touch /tmp/fim-test.txt. Audit family should be 0 by design; bpf table presence is the canary."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "health-3-linux-evented"
  observer_can_run: false
  platform: "linux"
  query: "SELECT 'file_events (all)' AS tbl, CAST(count(*) AS TEXT) AS n, '>0' AS expected FROM file_events WHERE time > 0 UNION ALL SELECT 'file_events ubuntu_file_events', CAST(count(*) AS TEXT), '>0 after you touch a file' FROM file_events WHERE time > 0 AND category='ubuntu_file_events' UNION ALL SELECT 'process_events', CAST(count(*) AS TEXT), '0 - audit off by design' FROM process_events WHERE time > 0 UNION ALL SELECT 'socket_events', CAST(count(*) AS TEXT), '0 - audit off by design' FROM socket_events WHERE time > 0 UNION ALL SELECT 'user_events', CAST(count(*) AS TEXT), '0 - audit off by design' FROM user_events WHERE time > 0 UNION ALL SELECT 'process_file_events', CAST(count(*) AS TEXT), '0 - audit off by design' FROM process_file_events WHERE time > 0 UNION ALL SELECT 'BPF CANARY: bpf table present', (SELECT CAST(count(*) AS TEXT) FROM osquery_registry WHERE registry='table' AND name='bpf_process_events'), '1 = fine. 0 = NO Linux process/socket eventing at all';"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Windows evented table row counts. First: create a file in Downloads and run nslookup example.com."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "health-4-windows-evented"
  observer_can_run: false
  platform: "windows"
  query: "SELECT 'ntfs_journal_events' AS tbl, CAST(count(*) AS TEXT) AS n, '>0 after you create a file' AS expected FROM ntfs_journal_events WHERE time > 0 UNION ALL SELECT 'ntfs category=Win_Yara_File_Path', CAST(count(*) AS TEXT), '>0 after you create a file' FROM ntfs_journal_events WHERE time > 0 AND category='Win_Yara_File_Path' UNION ALL SELECT 'ntfs category=windows_file_events (v3/v4 only)', CAST(count(*) AS TEXT), '0 once v5 is applied' FROM ntfs_journal_events WHERE time > 0 AND category='windows_file_events' UNION ALL SELECT 'windows_events', CAST(count(*) AS TEXT), '>0' FROM windows_events WHERE time > 0 UNION ALL SELECT 'windows_events 4104', CAST(count(*) AS TEXT), '0 - channel dropped in v4' FROM windows_events WHERE time > 0 AND eventid=4104 UNION ALL SELECT 'powershell_events', CAST(count(*) AS TEXT), '0 unless Script Block Logging on' FROM powershell_events WHERE time > 0 UNION ALL SELECT 'process_etw_events', CAST(count(*) AS TEXT), '>0' FROM process_etw_events WHERE time > 0 UNION ALL SELECT 'dns_lookup_events', CAST(count(*) AS TEXT), '>0 after nslookup' FROM dns_lookup_events WHERE time > 0;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "macOS ATC table registration check. If an ATC table failed to register, this query errors and that error is the finding."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "health-5-macos-atc"
  observer_can_run: false
  platform: "darwin"
  query: "SELECT 'quarantine_items' AS tbl, CAST(count(*) AS TEXT) AS n FROM quarantine_items UNION ALL SELECT 'chrome_url_history', CAST(count(*) AS TEXT) FROM chrome_url_history UNION ALL SELECT 'chrome_download_history', CAST(count(*) AS TEXT) FROM chrome_download_history UNION ALL SELECT 'firefox_url_history', CAST(count(*) AS TEXT) FROM firefox_url_history;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Windows ATC table row counts."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "health-6-windows-atc"
  observer_can_run: false
  platform: "windows"
  query: "SELECT 'chrome_url_history' AS tbl, CAST(count(*) AS TEXT) AS n FROM chrome_url_history UNION ALL SELECT 'edge_url_history', CAST(count(*) AS TEXT) FROM edge_url_history UNION ALL SELECT 'chrome_download_history', CAST(count(*) AS TEXT) FROM chrome_download_history UNION ALL SELECT 'firefox_url_history', CAST(count(*) AS TEXT) FROM firefox_url_history;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "YARA smoke test with the EICAR file. Create /tmp/eicar.com first; count=1 and matches Multi_EICAR_ac8f42d6 means the whole chain works."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "health-7-yara-eicar"
  observer_can_run: false
  platform: ""
  query: "SELECT path, count, matches FROM yara_file WHERE path = '/tmp/eicar.com' AND sigurl = 'https://raw.githubusercontent.com/karmine05/gitops-yara/main/rules/multi/eicar.yar';"
