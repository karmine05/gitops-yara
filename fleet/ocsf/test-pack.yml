---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "NTFS journal + the renamed category. Create a file in Downloads first; expect Win_Yara_File_Path."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-1-9-ntfs-category"
  observer_can_run: false
  platform: "windows"
  query: "SELECT category, action, count(*) AS n FROM ntfs_journal_events WHERE time > 0 GROUP BY category, action ORDER BY n DESC;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "NTFS journal detail."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-1-10-ntfs-detail"
  observer_can_run: false
  platform: "windows"
  query: "SELECT datetime(time,'unixepoch') AS t, action, category, path, old_path, drive_letter FROM ntfs_journal_events WHERE time > 0 ORDER BY time DESC LIMIT 20;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Windows event log channels. Expect only Security, Application, System."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-1-11-win-event-channels"
  observer_can_run: false
  platform: "windows"
  query: "SELECT source, provider_name, eventid, count(*) AS n FROM windows_events WHERE time > 0 GROUP BY source, provider_name, eventid ORDER BY n DESC LIMIT 25;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "PowerShell de-duplication check. in_windows_events must be 0 in v5."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-1-12-powershell-dedup"
  observer_can_run: false
  platform: "windows"
  query: "SELECT (SELECT count(*) FROM windows_events WHERE time > 0 AND eventid = 4104) AS in_windows_events, (SELECT count(*) FROM powershell_events WHERE time > 0) AS in_powershell_events;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "PowerShell script blocks."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
