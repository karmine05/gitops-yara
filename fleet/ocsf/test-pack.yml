  observer_can_run: false
  platform: "linux"
  query: "SELECT datetime(time,'unixepoch') AS t, target_path, category, action, size, sha256 FROM file_events WHERE time > 0 AND category = 'ubuntu_file_events' ORDER BY time DESC LIMIT 20;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Linux process eventing canary. See the bpf canary report before trusting this."
  discard_data: false
  fleet: ""
