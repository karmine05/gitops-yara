  name: "test-3-5-yara-process"
  observer_can_run: false
  platform: "linux"
  query: "SELECT pid, count, matches FROM yara_process WHERE pid = 1234 AND sigurl = 'https://raw.githubusercontent.com/karmine05/gitops-yara/main/rules/linux/_all.yar';"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "The pattern that replaces yara_events: let FIM pick the scan targets."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-3-6-fim-feed-scan"
  observer_can_run: false
  platform: "darwin,linux"
  query: "SELECT datetime(time,'unixepoch') AS t, target_path, category, action, size, sha256 FROM file_events WHERE time > 0 AND action IN ('CREATED','UPDATED') AND size > 0 ORDER BY time DESC LIMIT 50;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Confirm the signature-base URL still works alongside your own repo."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-3-7-signature-base-check"
  observer_can_run: false
  platform: ""
  query: "SELECT path, count, matches FROM yara_file WHERE path = '/tmp/eicar.com' AND sigurl = 'https://raw.githubusercontent.com/Neo23x0/signature-base/master/yara/generic_anomalies.yar';"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "BPF canary: 5.23.1 is the last release with BPF eventing. Run on every Linux host after any agent upgrade."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-4-bpf-canary"
  observer_can_run: false
  platform: "linux"
  query: "SELECT (SELECT version FROM osquery_info) AS osquery_version, (SELECT count(*) FROM osquery_flags WHERE name='enable_bpf_events') AS bpf_flag_exists, (SELECT count(*) FROM osquery_registry WHERE registry='table' AND name='bpf_process_events') AS bpf_table_exists, (SELECT count(*) FROM osquery_flags WHERE name='disable_audit' AND value='false') AS audit_enabled;"
