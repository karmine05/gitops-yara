# Fleet report specs for test-pack.sql. Import: fleetctl apply -f fleet/ocsf/test-pack.yml
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Which publishers are alive and producing. active=1 events>0 working; active=1 events=0 paths or rules; active=0 flag missing or unsupported."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-0-1-publisher-status"
  observer_can_run: false
  platform: ""
  query: "SELECT name, publisher, type, subscriptions, events, refreshes, active FROM osquery_events ORDER BY active DESC, events DESC;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Which evented/ATC tables actually exist in this build. Separates table missing from table present but empty."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-0-2-evented-table-existence"
  observer_can_run: false
  platform: ""
  query: "SELECT name, active FROM osquery_registry WHERE registry = 'table' AND name IN ( 'es_process_events','es_process_file_events','file_events','yara_events', 'yara_file','yara_process','bpf_process_events','bpf_socket_events', 'process_events','socket_events','user_events','process_file_events', 'ntfs_journal_events','windows_events','powershell_events', 'process_etw_events','dns_lookup_events', 'quarantine_items','chrome_url_history','chrome_download_history', 'firefox_url_history','edge_url_history' ) ORDER BY name;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Did the v5 flags land. yara_sigurl_authenticate must be false; windows_event_channels should be Security,Application,System."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-0-3-v5-flags"
  observer_can_run: false
  platform: ""
  query: "SELECT name, value, default_value FROM osquery_flags WHERE name IN ( 'disable_events','events_expiry','events_max','enable_file_events', 'enable_bpf_events','disable_audit','disable_endpointsecurity', 'disable_endpointsecurity_fim','enable_ntfs_event_publisher', 'enable_windows_events_publisher','enable_powershell_events_subscriber', 'enable_process_etw_events','enable_dns_lookup_events', 'windows_event_channels','yara_sigurl_authenticate','yara_delay', 'disable_watchdog' ) ORDER BY name;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Agent version and cost. resident_size lives on processes, joined on pid. Check a day after rollout, especially Windows."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-0-4-version-cost"
  observer_can_run: false
  platform: ""
  query: "SELECT i.version, i.build_platform, i.config_valid, p.resident_size, p.user_time, p.system_time, (strftime('%s','now') - p.start_time) AS uptime_seconds FROM osquery_info i JOIN processes p ON p.pid = i.pid;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Consolidated macOS evented counts. yara_events = 0 is correct in v5; es_* = 0 usually means Full Disk Access is missing."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-1-1-macos-evented-counts"
  observer_can_run: false
  platform: "darwin"
  query: "SELECT 'es_process_events' AS tbl, count(*) AS n FROM es_process_events WHERE time > 0 UNION ALL SELECT 'es_process_file_events', count(*) FROM es_process_file_events WHERE time > 0 UNION ALL SELECT 'file_events', count(*) FROM file_events WHERE time > 0 UNION ALL SELECT 'yara_events', count(*) FROM yara_events WHERE time > 0;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "macOS process eventing detail."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-1-2-macos-process-detail"
  observer_can_run: false
  platform: "darwin"
  query: "SELECT datetime(time,'unixepoch') AS t, event_type, pid, path, cmdline, username, signing_id, team_id, platform_binary FROM es_process_events WHERE time > 0 ORDER BY time DESC LIMIT 20;"

---
apiVersion: v1
kind: report
spec:
