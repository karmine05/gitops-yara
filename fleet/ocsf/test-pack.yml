  observer_can_run: false
  platform: "windows"
  query: "SELECT datetime(time,'unixepoch') AS t, script_name, script_path, cosine_similarity, substr(script_text,1,200) AS script_head FROM powershell_events WHERE time > 0 ORDER BY time DESC LIMIT 10;"

---
