---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "macOS quarantine: what did Gatekeeper tag, and where did it come from. Apple epoch is 2001-01-01, hence the +978307200 offset."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-2-3-macos-quarantine"
  observer_can_run: false
  platform: "darwin"
  query: "SELECT datetime(timestamp + 978307200,'unixepoch') AS downloaded, agent_name, origin_url, data_url, sender_name FROM quarantine_items ORDER BY timestamp DESC LIMIT 25;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Recent downloads from chrome_download_history."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-2-4-recent-downloads"
  observer_can_run: false
  platform: "darwin,windows"
  query: "SELECT id, current_path, target_path FROM chrome_download_history ORDER BY id DESC LIMIT 25;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Browsing history sanity check. Chrome/Edge timestamps are microseconds since 1601-01-01."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-2-5-chrome-history"
  observer_can_run: false
  platform: "darwin,windows"
  query: "SELECT url, title, visit_count, datetime(last_visit_time/1000000 - 11644473600,'unixepoch') AS last_visit FROM chrome_url_history WHERE visit_count > 0 ORDER BY last_visit_time DESC LIMIT 25;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Firefox history. Firefox uses microseconds since 1970."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-2-6-firefox-history"
  observer_can_run: false
  platform: "darwin,windows"
  query: "SELECT url, title, visit_count, datetime(last_visit_date/1000000,'unixepoch') AS last_visit FROM firefox_url_history WHERE visit_count > 0 ORDER BY last_visit_date DESC LIMIT 25;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Cross-check ATC against FIM: a download that Gatekeeper quarantined AND that FIM saw land on disk."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-2-7-atc-vs-fim"
  observer_can_run: false
  platform: "darwin"
  query: "SELECT q.origin_url, q.agent_name, f.target_path, f.sha256, datetime(f.time,'unixepoch') AS seen FROM quarantine_items q JOIN file_events f ON f.target_path LIKE '%' || q.data_url || '%' ORDER BY f.time DESC LIMIT 20;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "YARA smoke test. Create /tmp/eicar.com first; expect count=1, matches Multi_EICAR_ac8f42d6."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-3-1-yara-eicar"
  observer_can_run: false
  platform: "darwin,linux"
  query: "SELECT path, count, matches FROM yara_file WHERE path = '/tmp/eicar.com' AND sigurl = 'https://raw.githubusercontent.com/karmine05/gitops-yara/main/rules/multi/eicar.yar';"

---
apiVersion: v1
kind: report
