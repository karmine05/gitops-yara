  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-1-3-macos-es-file-detail"
  observer_can_run: false
  platform: "darwin"
  query: "SELECT datetime(time,'unixepoch') AS t, event_type, pid, path, dest_filename FROM es_process_file_events WHERE time > 0 ORDER BY time DESC LIMIT 20;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "macOS FIM. Touch a file in Downloads first."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-1-4-macos-fim"
  observer_can_run: false
  platform: "darwin"
  query: "SELECT datetime(time,'unixepoch') AS t, target_path, category, action, size, sha256 FROM file_events WHERE time > 0 AND category = 'Mac_Yara_File_Path' ORDER BY time DESC LIMIT 20;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
  description: "Consolidated Linux evented counts. The audit family SHOULD be 0 (disable_audit); file_events is the one that must be non-zero."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-1-5-linux-evented-counts"
  observer_can_run: false
  platform: "linux"
  query: "SELECT 'file_events' AS tbl, count(*) AS n FROM file_events WHERE time > 0 UNION ALL SELECT 'process_events', count(*) FROM process_events WHERE time > 0 UNION ALL SELECT 'socket_events', count(*) FROM socket_events WHERE time > 0 UNION ALL SELECT 'user_events', count(*) FROM user_events WHERE time > 0 UNION ALL SELECT 'process_file_events', count(*) FROM process_file_events WHERE time > 0;"

---
apiVersion: v1
kind: report
spec:
  automations_enabled: false
