  automations_enabled: false
  description: "Targeted YARA scan by category, small fetch, fast."
  discard_data: false
  fleet: ""
  interval: 0
  logging: snapshot
  min_osquery_version: ""
  name: "test-3-2-yara-ransomware"
  observer_can_run: false
  platform: "linux"
  query: "SELECT path, count, matches FROM yara_file WHERE path = '/tmp/suspect.bin' AND sigurl = 'https://raw.githubusercontent.com/karmine05/gitops-yara/main/rules/linux/ransomware.yar';"

---
apiVersion: v1
